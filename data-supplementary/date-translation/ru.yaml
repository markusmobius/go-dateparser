simplifications:
  - од(?:ин|на|ну|ни|ной|ною|но|ного|ному|ним|нем): '1'
  - перв(?:ой|ого|ому|ым|ом|ая|ую|ое|ые|ых|ыми): '1'
  - дв(?:а|е|ух|ум|умя|ое): '2'
  - пар(?:а|ы|е|у|ой|ою|ам|ами|ах): '2'
  - втор(?:ой|ого|ому|ым|ом|ая|ую|ое|ые|ых|ыми): '2'
  - тр(?:и|ёх|ем|ём|емя|етье): '3'
  - трети(?:й|его|ему|им|ем|я|ей|ею|ую|е|и|их|ими): '3'
  - четыр(?:е|ёх|ем|ём|ьмя): '4'
  - четвёрт(?:ый|ого|ому|ым|ом|ая|ой|ою|ую|ое|ые|ых|ыми): '4'
  - четверт(?:ый|ого|ому|ым|ом|ая|ой|ою|ую|ое|ые|ых|ыми): '4'
  - пят(?:ь|и|ью): '5'
  - пят(?:ый|ого|ому|ым|ом|ая|ой|ою|ую|ое|ые|ых|ыми): '5'
  - шест(?:ь|и|ью): '6'
  - шест(?:ый|ого|ому|ым|ом|ая|ой|ою|ую|ое|ые|ых|ыми): '6'
  - сем(?:ь|и|ью): '7'
  - седьм(?:ой|ого|ому|ым|ом|ая|ой|ою|ую|ое|ые|ых|ыми): '7'
  - восьм(?:и|ью|ьею)|восем(?:ь|ью): '8'
  - восьм(?:ой|ого|ому|ым|ом|ая|ой|ою|ую|ое|ые|ых|ыми): '8'
  - девят(?:ь|и|ью): '9'
  - девят(?:ый|ого|ому|ым|ом|ая|ой|ою|ую|ое|ые|ых|ыми): '9'
  - десять: '10'
  - одиннадцать: '11'
  - двенадцать: '12'
  - пятнадцать: '15'
  - двадцат(?:ь|ое): '20'
  - тридцат(?:ь|ое): '30'
  - соро(?:к|ка|ковое): '40'
  - пятьдесят: '50'
  - пятидесятое: '50'
  - несколько секунд: 44 секунды
  - полчаса: 30 минут
  - полгода: 6 месяцев
  - полтора часа: 90 минут
  - полтора года: 18 месяцев
  - ((?:через|спустя|в течение)\s+)секунд[уы]: ${1}1 секунду
  - ((?:через|спустя|в течение)\s+)минут[уы]: ${1}1 минуту
  - ((?:через|спустя|в течение)\s+)часа?: ${1}1 час
  - ((?:через|спустя|в течение)\s+)(?:день|дня): ${1}1 день
  - ((?:через|спустя|в течение)\s+)сут(?:ки|ок): ${1}1 сутки
  - ((?:через|спустя|в течение)\s+)недел[юи]: ${1}1 неделю
  - ((?:через|спустя|в течение)\s+)месяца?: ${1}1 месяц
  - ((?:через|спустя|в течение)\s+)года?: ${1}1 год
  - ([^\d]\s+|^)секунду(\s+назад): ${1}1 секунду\2
  - ([^\d]\s+|^)минуту(\s+назад): ${1}1 минуту\2
  - ([^\d]\s+|^)час(\s+назад): ${1}1 час\2
  - ([^\d]\s+|^)день(\s+назад): ${1}1 день\2
  - ([^\d]\s+|^)сутки(\s+назад): ${1}1 сутки\2
  - ([^\d]\s+|^)неделю(\s+назад): ${1}1 неделю\2
  - ([^\d]\s+|^)месяц(\s+назад): ${1}1 месяц\2
  - ([^\d]\s+|^)год(\s+назад): ${1}1 год\2
  - (\d{3,}1)\s*год\s*$: \1
  - (\d*[02-9])\s*год\b: \1
am:
  - дп

pm:
  - пп

relative-type-regex:
  \1 day ago:
    - (\d+[.,]?\d*) д назад
  in \1 day:
    - через (\d+[.,]?\d*) д
